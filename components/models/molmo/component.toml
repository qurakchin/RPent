schema = 1
name = "molmo"
kind = "model"
probe = "components.models.molmo.server"
python = ">=3.10,<3.13"
platforms = ["linux-x86_64"]
placement = ["in-env", "remote"]
# Molmo's model code needs transformers >=4.57, while RoboTwin's stack is pinned
# to 4.51.3. Install Molmo in its own profile and connect over RPC; placing both
# in one environment is rejected before installation.
env_conflicts = ["robotwin"]
docs = "docs/source-en/rst_source/guides/flash.rst"

dependencies = [
  "transformers>=4.57",
  "torch",
  "torchvision",
  "pillow>=10",
]
