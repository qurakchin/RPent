schema = 1
name = "robodojo-sim"
python = "3.11"
platform = "linux-x86_64"
# Isaac Sim 5.1 wheels are published for glibc 2.35 and newer.
manylinux = "2_35"
lock = "envs/locks/robodojo-sim.lock"
