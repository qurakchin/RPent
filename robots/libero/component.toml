schema = 2
name = "robot-libero"
probe = "robots.libero"
python = ">=3.10,<3.13"
platforms = ["linux-x86_64"]
# LIBERO measures task success inside robosuite; the Franka stack pins
# numpy<2, and RoboTwin's runtime ships incompatible MuJoCo/Torch builds.
requires = ["sim-libero", "model-openpi", "model-sam3"]
env_conflicts = ["robot-franka", "robot-dual_franka", "robot-robotwin"]

dependencies = []
