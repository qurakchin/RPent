schema = 1
name = "libero"
kind = "robot"
probe = "robots.libero"
python = ">=3.10,<3.13"
platforms = ["linux-x86_64"]
requires = ["rlinf", "openpi", "sam3"]
# LIBERO measures task success inside robosuite; the Franka stack pins
# numpy<2, and RoboTwin's runtime ships incompatible MuJoCo/Torch builds.
env_conflicts = ["franka", "dual_franka", "robotwin"]
placement = ["in-env"]
variant_required = true
docs = "docs/source-en/rst_source/simulators/libero.rst"

[optional]
# The variants differ in the simulator package they install, so every profile
# that includes LIBERO must pick one. `plus` cannot inherit `standard` because
# LIBERO-plus requires robosuite<1.5, while the standard package pins a newer
# robosuite.
standard = [
  "rpent-libero @ git+https://github.com/RLinf/LIBERO.git@a8323074d93a09e32bd898630a70531b1f51bc77",
  # MuJoCo 3.4+ changes LIBERO settling, misplacing objects and reducing task
  # success; see https://github.com/RLinf/RLinf/issues/1460.
  "mujoco==3.3.0",
]
pro = [
  "rpent-libero @ git+https://github.com/RLinf/LIBERO.git@a8323074d93a09e32bd898630a70531b1f51bc77",
  "rpent-liberopro @ git+https://github.com/RLinf/LIBERO-PRO.git@d1e11fb181b8544487d27742c0caa3a4d46452ad",
  "mujoco==3.3.0",
]
# `pro` plus the LeRobot stack used to export and replay trajectories. The
# optional groups are additive and cannot inherit, so the PRO packages repeat.
# LeRobot 0.3.x expects Fraction frame rates, PyAV 19 returns AVRational, and
# OpenPI requires NumPy 1.x while PyArrow 26 requires NumPy 2 at import time.
pro-flywheel = [
  "rpent-libero @ git+https://github.com/RLinf/LIBERO.git@a8323074d93a09e32bd898630a70531b1f51bc77",
  "rpent-liberopro @ git+https://github.com/RLinf/LIBERO-PRO.git@d1e11fb181b8544487d27742c0caa3a4d46452ad",
  "mujoco==3.3.0",
  "lerobot>=0.3.3,<0.4",
  "av<19",
  "pyarrow<26",
]
plus = [
  "rlinf-liberoplus",
  "mujoco==3.3.0",
  "h5py",
]
