schema = 1
name = "franka"
kind = "robot"
probe = "robots.franka.robot_spec"
python = ">=3.10,<3.13"
platforms = ["linux-x86_64"]
requires = ["rlinf", "openpi"]
# Franka pins numpy<2 and gymnasium==0.29.1 for franky-control and the camera
# stack, so it cannot share an environment with the simulator adapters below.
env_conflicts = ["libero", "robocasa", "robotwin", "robodojo", "robodojo-sim"]
placement = ["in-env"]
docs = "docs/source-en/rst_source/real_world_robots/franka.rst"

dependencies = [
  # Keep this list aligned with requirements/embodied/envs/franka.txt at the
  # RLinf revision pinned by the rlinf capability.
  "pyyaml",
  "rospkg",
  "pyrealsense2; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "empy==3.3.4",
  "gymnasium==0.29.1",
  "pyquaternion",
  "opencv-python",
  "defusedxml",
  "pyspacemouse>=2.0.0",
  "pymodbus>=3.0,<4.0",
  "pyserial",
  "imageio[ffmpeg]",
  "evdev",
  "numpy<2",
  # PyArrow 26 requires NumPy >=2 at import time, incompatible with Franka.
  "pyarrow<26.0.0",
  "pyzmq",
  "websockets",
  "franky-control @ https://github.com/Brunch-Life/franky/releases/download/wheels-libfranka-0.19.0/franky_control-1.1.3-cp310-cp310-manylinux_2_28_x86_64.whl ; python_version == '3.10' and sys_platform == 'linux' and platform_machine == 'x86_64'",
  "franky-control @ https://github.com/Brunch-Life/franky/releases/download/wheels-libfranka-0.19.0/franky_control-1.1.3-cp311-cp311-manylinux_2_28_x86_64.whl ; python_version == '3.11' and sys_platform == 'linux' and platform_machine == 'x86_64'",
  "franky-control @ https://github.com/Brunch-Life/franky/releases/download/wheels-libfranka-0.19.0/franky_control-1.1.3-cp312-cp312-manylinux_2_28_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
  "matplotlib>=3.8",
  "pillow>=10",
]
