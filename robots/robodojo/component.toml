schema = 1
name = "robodojo"
kind = "robot"
probe = "robots.robodojo"
python = ">=3.11,<3.12"
platforms = ["linux-x86_64"]
requires = ["sam3", "openpi"]
# RoboDojo pins its own RLinf fork and an Isaac Sim stack that breaks the other
# simulator runtimes and the regular RLinf release.
env_conflicts = ["franka", "dual_franka", "robotwin", "rlinf"]
placement = ["in-env"]
overrides = ["requirements/robodojo-override.txt"]
docs = "docs/source-en/rst_source/simulators/robodojo.rst"

dependencies = [
  "rlinf @ git+https://github.com/littleZ05/RLinf.git@rpent/robodojo",
  "rlinf-robodojo-runtime @ git+https://github.com/RLinf/RoboDojo.git@rpent",
  # datasets 5 requires PyArrow >=21; PyArrow 26 needs NumPy >=2,
  # incompatible with RoboDojo's NumPy 1 simulator stack.
  "pyarrow>=21.0.0,<26.0.0",
]
