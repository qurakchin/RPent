schema = 2
name = "robot-robodojo"
probe = "robots.robodojo"
python = ">=3.11,<3.12"
description = "RoboDojo / Isaac Sim adapter without a policy or segmentation model."
# The simulator runtime, its Isaac Sim index settings, and the cuRobo override
# belong to `sim-robodojo`; this component installs the adapter and the tasks it
# exposes.
requires = ["sim-robodojo"]
# RoboDojo pins its own RLinf fork and an Isaac Sim stack that breaks the other
# simulator runtimes. ``infra-rlinf`` is a package-source conflict: the
# simulator installs the same distribution from a different revision than the
# release runtime, so the two cannot resolve together.
env_conflicts = [
  "robot-franka",
  "robot-dual_franka",
  "sim-robotwin",
  "infra-rlinf",
]

dependencies = []
