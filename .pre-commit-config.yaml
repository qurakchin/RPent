default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.22"
    hooks:
      - id: ruff
        args: ["--preview", "--fix"]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: https://github.com/commit-check/commit-check
    rev: "v2.11.1"
    hooks:
      - id: check-message
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: docs-check
        name: Check documentation links and validation status
        entry: python scripts/check_docs.py --quiet
        language: system
        pass_filenames: true
        files: '\.(md|rst)$'
        stages: [pre-commit]
      # The page hook filters by filename, so a checker edit would otherwise
      # select no files and run nothing. Recheck the whole tree when the
      # checker itself changes; CI runs this on every push as well.
      - id: docs-check-self
        name: Recheck all documentation after changing the checker
        entry: python scripts/check_docs.py --quiet
        language: system
        pass_filenames: false
        files: '^scripts/check_docs\.py$'
        stages: [pre-commit]
