name: Simulator environment builds

on:
  workflow_call:
    inputs:
      components:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: rpent-build
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.components) }}
    env:
      UV_CACHE_DIR: /mnt/public/rpent_shared/cache/uv
      UV_PYTHON_INSTALL_DIR: /mnt/public/rpent_shared/python
      UV_TORCH_BACKEND: auto
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.component }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build a new environment
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          RPENT_INSTALL_TIMEOUT: 90m
        run: |
          set -euo pipefail
          run_dir="$RUNNER_TEMP/rpent-build-$BUILD_ID"
          {
            echo "Component: $COMPONENT"
            git rev-parse HEAD
            uv --version
            uv cache dir
            uv python dir
            time bash tests/e2e_tests/run_gpu_suite.sh \
              "build:$COMPONENT" "$run_dir" "$RUNNER_TEMP/rpent-build-venv-$BUILD_ID"
          } 2>&1 | tee "$RUNNER_TEMP/rpent-build-$BUILD_ID.log"

      - name: Upload build log and fingerprint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.component }}
          path: |
            ${{ runner.temp }}/rpent-build-${{ env.BUILD_ID }}.log
            ${{ runner.temp }}/rpent-build-${{ env.BUILD_ID }}/rpent-install.json
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        shell: bash
        run: |
          for directory in \
            "$RUNNER_TEMP/rpent-build-$BUILD_ID" \
            "$RUNNER_TEMP/rpent-build-venv-$BUILD_ID"; do
            if [[ -d "$directory" ]]; then
              find "$directory" -depth -delete
            fi
          done
          rm -f "$RUNNER_TEMP/rpent-build-$BUILD_ID.log"
