name: Simulator environment builds

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      component:
        description: Simulator component to build
        type: choice
        default: all
        options:
          - all
          - robot-libero
          - robot-libero_plus
          - robot-robocasa
          - robot-robotwin
          - robot-robodojo
          - robot-robolab
      no_cache:
        description: Build without reusing the shared uv cache
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["/ci-build", "/ci-build-all", "/ci-build-robot-libero", "/ci-build-robot-libero_plus", "/ci-build-robot-robocasa", "/ci-build-robot-robotwin", "/ci-build-robot-robodojo", "/ci-build-robot-robolab", "/ci-build --no-cache", "/ci-build-all --no-cache", "/ci-build-robot-libero --no-cache", "/ci-build-robot-libero_plus --no-cache", "/ci-build-robot-robocasa --no-cache", "/ci-build-robot-robotwin --no-cache", "/ci-build-robot-robodojo --no-cache", "/ci-build-robot-robolab --no-cache"]'), github.event.comment.body)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    outputs:
      repository: ${{ steps.resolve.outputs.repository }}
      revision: ${{ steps.resolve.outputs.revision }}
      component: ${{ steps.resolve.outputs.component }}
      no_cache: ${{ steps.resolve.outputs.no_cache }}
      comment_id: ${{ steps.reply.outputs.comment_id }}
    steps:
      - name: Resolve build target
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_COMPONENT: ${{ inputs.component }}
          INPUT_NO_CACHE: ${{ inputs.no_cache }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            no_cache="false"
            if [[ "${INPUT_NO_CACHE:-false}" == "true" ]]; then
              no_cache="true"
            fi
            {
              echo "repository=$GITHUB_REPOSITORY"
              echo "revision=$GITHUB_SHA"
              echo "component=${INPUT_COMPONENT:-all}"
              echo "no_cache=$no_cache"
            } >> "$GITHUB_OUTPUT"
          else
            mapfile -t head < <(
              gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
                --jq '.head.repo.full_name, .head.sha'
            )
            [[ ${#head[@]} -eq 2 && -n "${head[0]}" && -n "${head[1]}" ]]
            no_cache="false"
            command="$COMMENT_BODY"
            if [[ "$command" == *" --no-cache" ]]; then
              no_cache="true"
              command="${command% --no-cache}"
            fi
            if [[ "$command" == "/ci-build" ]]; then
              component="all"
            else
              component="${command#/ci-build-}"
            fi
            {
              echo "repository=${head[0]}"
              echo "revision=${head[1]}"
              echo "component=$component"
              echo "no_cache=$no_cache"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Reply with run link
        if: github.event_name == 'issue_comment'
        id: reply
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMPONENT: ${{ steps.resolve.outputs.component }}
          NO_CACHE: ${{ steps.resolve.outputs.no_cache }}
          REVISION: ${{ steps.resolve.outputs.revision }}
        run: |
          body_file=$(mktemp "$RUNNER_TEMP/rpent-ci-build-reply.XXXXXX")
          trap 'rm -f "$body_file"' EXIT
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          mode=""
          if [[ "${NO_CACHE:-false}" == "true" ]]; then
            mode=" (no cache)"
          fi
          printf 'Accepted **%s environment build%s** for commit `%s`.\n\n[View status and logs](%s)\n' \
            "$COMPONENT" "$mode" "$REVISION" "$run_url" > "$body_file"
          comment_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --field "body=@$body_file" --jq '.id')
          echo "comment_id=$comment_id" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: Build ${{ matrix.component }}
    runs-on: rpent-build
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON((needs.resolve.outputs.component == '' || needs.resolve.outputs.component == 'all') && '["robot-libero","robot-libero_plus","robot-robocasa","robot-robotwin","robot-robodojo","robot-robolab"]' || format('["{0}"]', needs.resolve.outputs.component)) }}
    env:
      UV_CACHE_DIR: /mnt/public/rpent_shared/cache/uv
      UV_PYTHON_INSTALL_DIR: /mnt/public/rpent_shared/python
      UV_TORCH_BACKEND: auto
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.component }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false

      - name: Build a new environment
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          NO_CACHE: ${{ needs.resolve.outputs.no_cache }}
          RPENT_INSTALL_TIMEOUT: 90m
        run: |
          set -euo pipefail
          run_dir="$RUNNER_TEMP/rpent-build-$BUILD_ID"
          if [[ "${NO_CACHE:-false}" == "true" ]]; then
            export UV_CACHE_DIR="$RUNNER_TEMP/rpent-build-cache-$BUILD_ID"
            mkdir -p "$UV_CACHE_DIR"
          fi
          {
            echo "Component: $COMPONENT"
            echo "No cache: ${NO_CACHE:-false}"
            git rev-parse HEAD
            uv --version
            uv cache dir
            uv python dir
            time bash tests/e2e_tests/run_gpu_suite.sh \
              "build:$COMPONENT" "$run_dir" "$RUNNER_TEMP/rpent-build-venv-$BUILD_ID"
          } 2>&1 | tee "$RUNNER_TEMP/rpent-build-$BUILD_ID.log"

      - name: Upload build log and fingerprint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.component }}
          path: |
            ${{ runner.temp }}/rpent-build-${{ env.BUILD_ID }}.log
            ${{ runner.temp }}/rpent-build-${{ env.BUILD_ID }}/rpent-install.json
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        shell: bash
        run: |
          for directory in \
            "$RUNNER_TEMP/rpent-build-$BUILD_ID" \
            "$RUNNER_TEMP/rpent-build-venv-$BUILD_ID" \
            "$RUNNER_TEMP/rpent-build-cache-$BUILD_ID"; do
            if [[ -d "$directory" ]]; then
              find "$directory" -depth -delete
            fi
          done
          rm -f "$RUNNER_TEMP/rpent-build-$BUILD_ID.log"

  comment-result:
    needs: [resolve, build]
    if: always() && needs.resolve.outputs.comment_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Update reply with result
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ needs.resolve.outputs.comment_id }}
          COMPONENT: ${{ needs.resolve.outputs.component }}
          NO_CACHE: ${{ needs.resolve.outputs.no_cache }}
          REVISION: ${{ needs.resolve.outputs.revision }}
          RESULT: ${{ needs.build.result }}
        run: |
          body_file=$(mktemp "$RUNNER_TEMP/rpent-ci-build-reply.XXXXXX")
          trap 'rm -f "$body_file"' EXIT
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          mode=""
          if [[ "${NO_CACHE:-false}" == "true" ]]; then
            mode=" (no cache)"
          fi
          printf '**%s environment build%s: %s** for commit `%s`.\n\n[View status and logs](%s)\n' \
            "$COMPONENT" "$mode" "$RESULT" "$REVISION" "$run_url" > "$body_file"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
            --field "body=@$body_file" --silent
