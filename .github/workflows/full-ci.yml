name: Full CI

# Proves a clean machine can install from the locks and run: every selected
# profile gets a fresh venv installed from its lock, doctored, and — where a
# simulator exists — exercised by the GPU suite. `fast ci` calls this workflow
# with the profiles a pull request affects; nightly, tags and manual runs select
# every profile.
on:
  schedule:
    # Offset from other nightly jobs to spread runner load.
    - cron: "17 3 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      hosted:
        description: JSON array of profiles installed on a hosted runner
        required: false
        type: string
        default: ""
      gpu:
        description: JSON array of profiles installed on the embodied runner
        required: false
        type: string
        default: ""
      e2e:
        description: JSON array of simulator suites (libero, robocasa, robotwin)
        required: false
        type: string
        default: ""
      toolkit:
        description: Replay the geometry toolkit's frozen corpus
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scope:
    name: Select profiles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hosted: ${{ steps.select.outputs.hosted }}
      gpu: ${{ steps.select.outputs.gpu }}
      e2e: ${{ steps.select.outputs.e2e }}
      toolkit: ${{ steps.select.outputs.toolkit }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Select the profiles and suites
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          CALLED_HOSTED: ${{ inputs.hosted }}
          CALLED_GPU: ${{ inputs.gpu }}
          CALLED_E2E: ${{ inputs.e2e }}
          CALLED_TOOLKIT: ${{ inputs.toolkit }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_call" ]]; then
            hosted=$CALLED_HOSTED
            gpu=$CALLED_GPU
            e2e=$CALLED_E2E
            toolkit=$CALLED_TOOLKIT
          else
            # Nightly, tag and manual runs cover every supported profile on the
            # runner its authored partition assigns it to.
            hosted=$(uv run --no-project --python 3.11 --with packaging -- \
              python -m rpent.cli.install matrix --runner hosted)
            gpu=$(uv run --no-project --python 3.11 --with packaging -- \
              python -m rpent.cli.install matrix --runner gpu)
            e2e='["libero","robocasa","robotwin"]'
            toolkit=true
          fi
          {
            echo "hosted=$hosted"
            echo "gpu=$gpu"
            echo "e2e=$e2e"
            echo "toolkit=$toolkit"
          } >> "$GITHUB_OUTPUT"

  unit:
    name: Unit checks
    uses: ./.github/workflows/unit.yml
    with:
      tests: "[]"

  env:
    name: Environments
    needs: scope
    uses: ./.github/workflows/env.yml
    with:
      hosted: ${{ needs.scope.outputs.hosted }}
      gpu: ${{ needs.scope.outputs.gpu }}
      e2e: ${{ needs.scope.outputs.e2e }}
      toolkit: ${{ needs.scope.outputs.toolkit == 'true' }}

  locks:
    name: Lock files match the manifests
    # `lock --check` recompiles the closure and fails when an upstream package
    # published a new version, so it gates a release instead of every night.
    # GPU locks resolve on the embodied runner: RoboTwin's cuRobo dependency
    # builds metadata that needs CUDA.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: embodied
    timeout-minutes: 180
    env:
      # Shared install policy used by RLinf's NVIDIA embodied runner.
      UV_CACHE_DIR: /workspace/dataset/.uv_cache
      UV_LINK_MODE: symlink
      UV_PYTHON_INSTALL_DIR: /workspace/dataset/.uv_python
      UV_TORCH_BACKEND: auto
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Locate the CUDA toolkit
        # cuRobo builds metadata during resolution; uv reads CUDA_HOME from the
        # environment. Runners that export it already are left untouched.
        run: |
          if [ -z "${CUDA_HOME:-}" ]; then
            nvcc="$(command -v nvcc || true)"
            if [ -n "$nvcc" ]; then
              echo "CUDA_HOME=$(dirname "$(dirname "$nvcc")")" >> "$GITHUB_ENV"
            fi
          fi
      - name: Every lock is up to date
        run: |
          uv run --no-project --python 3.11 --with packaging -- \
            python -m rpent.cli.install lock --all --check
