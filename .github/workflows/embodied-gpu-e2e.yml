name: Simulator CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: simulator-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: Select affected simulator targets
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.targets.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Map changed files to simulator targets
        id: targets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tests/tooling/ci_targets.py "$BASE" "$GITHUB_SHA"

  e2e:
    needs: select
    if: needs.select.outputs.suites != '[]'
    uses: ./.github/workflows/embodied-gpu-e2e-run.yml
    with:
      suites: ${{ needs.select.outputs.suites }}

  # Single stable status check for branch rulesets.
  simulator-ci:
    name: simulator-ci
    if: always()
    needs: [select, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require simulator checks to pass
        run: |
          failed=0
          for result in 'select:${{ needs.select.result }}' \
                        'e2e:${{ needs.e2e.result }}'; do
            echo "check result: $result"
            case "${result#*:}" in
              success|skipped) ;;
              *) echo "::error::$result did not succeed"; failed=1 ;;
            esac
          done
          exit "$failed"
