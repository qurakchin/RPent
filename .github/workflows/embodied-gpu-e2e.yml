name: Simulator CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: simulator-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: Select affected simulator targets
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.targets.outputs.builds }}
      suites: ${{ steps.targets.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Map changed files to simulator targets
        id: targets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tests/tooling/ci_targets.py "$BASE" "$GITHUB_SHA"

  build:
    needs: select
    if: >-
      needs.select.outputs.builds != '[]' &&
      (
        github.event_name == 'push' ||
        (!github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'run-ci'))
      )
    uses: ./.github/workflows/environment-build.yml
    with:
      components: ${{ needs.select.outputs.builds }}

  e2e:
    needs: select
    if: >-
      needs.select.outputs.suites != '[]' &&
      (
        github.event_name == 'push' ||
        (!github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'run-ci'))
      )
    uses: ./.github/workflows/embodied-gpu-e2e-run.yml
    with:
      suites: ${{ needs.select.outputs.suites }}
