name: Simulator CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: simulator-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: Select affected simulator targets
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.targets.outputs.builds }}
      suites: ${{ steps.targets.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Map changed files to simulator targets
        id: targets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tests/tooling/ci_targets.py "$BASE" "$GITHUB_SHA"

  build:
    needs: select
    if: needs.select.outputs.builds != '[]'
    uses: ./.github/workflows/environment-build.yml
    with:
      components: ${{ needs.select.outputs.builds }}

  e2e:
    needs: select
    if: needs.select.outputs.suites != '[]'
    uses: ./.github/workflows/embodied-gpu-e2e-run.yml
    with:
      suites: ${{ needs.select.outputs.suites }}
