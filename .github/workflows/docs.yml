name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.language }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [en, zh]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: python -m pip install -r docs/requirements.txt
      # -W turns every warning into an error: broken references, missing images,
      # and malformed tables fail the build instead of shipping quietly.
      - name: Build ${{ matrix.language }}
        working-directory: docs
        run: >-
          sphinx-build -E -W --keep-going -b html
          source-${{ matrix.language }} build/html-${{ matrix.language }}

  linkcheck:
    name: Link check
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Check external links
        working-directory: docs
        run: |
          sphinx-build -W --keep-going -b linkcheck -q source-en build/linkcheck-en
          sphinx-build -W --keep-going -b linkcheck -q source-zh build/linkcheck-zh
