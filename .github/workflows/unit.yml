name: Unit checks

# Reusable verification jobs. Nothing here decides *which* paths matter; the
# orchestrators pass a scope in, so a manual run equals a full run.
on:
  workflow_call:
    inputs:
      tests:
        description: JSON array of test paths; empty runs the whole unit suite
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  static:
    name: Static structure checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Check the component layout
        run: |
          uv run --no-project --python 3.11 --with packaging -- \
            python -m rpent.cli.install check-layout
      - name: Check every profile and its lock coverage
        run: |
          uv run --no-project --python 3.11 --with packaging -- \
            python -m rpent.cli.install check --all
      - name: Check generated extras
        run: |
          uv run --no-project --python 3.11 --with packaging -- \
            python -m rpent.cli.install extras --check
      - name: Check the runner partition
        run: |
          uv run --no-project --python 3.11 --with packaging -- \
            python -m rpent.cli.install matrix --check

  unit:
    name: Unit, contract and failure-path tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Pin the profile's Python
        run: uv python install 3.11
      - name: Read the environment cache key
        id: key
        run: echo "lock=$(sha256sum installs/locks/dev.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # The prebuilt environment is reproducible from the dev profile's lock, so
      # the cache key is that lock's hash plus the interpreter and platform.
      - name: Restore the prebuilt environment
        id: env
        uses: actions/cache@v4
        with:
          path: .venv
          key: rpent-dev-${{ runner.os }}-py311-${{ steps.key.outputs.lock }}
      - name: Build the prebuilt environment from the lock
        if: steps.env.outputs.cache-hit != 'true'
        run: |
          uv run --no-project --python 3.11 --with packaging -- \
            python -m rpent.cli.install install dev --venv .venv
      - name: Run the selected tests
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          mapfile -t paths < <(
            python3 -c 'import json, os; print("\n".join(json.loads(os.environ["TESTS"] or "[]")))'
          )
          if [[ ${#paths[@]} -eq 0 ]]; then
            paths=(tests/unit_tests)
          fi
          .venv/bin/python -m pytest "${paths[@]}" -v

  minimal-imports:
    name: Minimal environment imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Pin the profile's Python
        run: uv python install 3.11
      - name: Read the environment cache key
        id: key
        run: echo "lock=$(sha256sum installs/locks/minimal.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore the minimal environment
        id: env
        uses: actions/cache@v4
        with:
          path: .venv-minimal
          key: rpent-minimal-${{ runner.os }}-py311-${{ steps.key.outputs.lock }}
      - name: Build the minimal environment from the lock
        if: steps.env.outputs.cache-hit != 'true'
        run: |
          uv run --no-project --python 3.11 --with packaging -- \
            python -m rpent.cli.install install minimal --venv .venv-minimal
      - name: Check CLI and robot discovery without robot extras
        run: |
          .venv-minimal/bin/python -c "
          import rpent
          from rpent.robots import enumerate_robots
          robots = enumerate_robots()
          assert robots, 'robot discovery returned no entries'
          print(rpent.__version__, sorted(robots))
          "
          .venv-minimal/bin/rpent --help >/dev/null
          .venv-minimal/bin/rpent-install list >/dev/null
      - name: Doctor the minimal environment
        run: |
          uv run --no-project --python 3.11 --with packaging -- \
            python -m rpent.cli.install doctor --venv .venv-minimal
