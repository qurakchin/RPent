name: Embodied GPU E2E run

on:
  workflow_call:
    inputs:
      suites:
        type: string
        required: true

permissions:
  contents: read

jobs:
  gpu-suite:
    name: GPU E2E (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.suites) }}
    runs-on: rpent-gpu
    timeout-minutes: 240
    env:
      # Shared resource root consumed by tests/e2e_tests/suites/*.toml
      RPENT_SHARED_ROOT: /mnt/public/rpent_shared

      # Shared runner and rendering settings (CUDA_VISIBLE_DEVICES comes from each runner's .env)
      SUITE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl

      # Shared dependency and model caches
      UV_CACHE_DIR: /mnt/public/rpent_shared/cache/uv
      UV_LOCK_TIMEOUT: "5400"  # Allow a concurrent cold download the full install budget.
      UV_LINK_MODE: symlink
      UV_PYTHON_INSTALL_DIR: /mnt/public/rpent_shared/python
      UV_TORCH_BACKEND: auto
      HF_HUB_CACHE: /mnt/public/rpent_shared/models/huggingface/hub
      OPENPI_DATA_HOME: /mnt/public/rpent_shared/models/openpi
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run selected GPU suite
        timeout-minutes: 225
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RPENT_INSTALL_TIMEOUT: 90m
          RPENT_TEST_TIMEOUT: 120m
          RPENT_GPU_PYTEST_TIMEOUT_SECONDS: "2400"
        run: |
          output_dir="$RUNNER_TEMP/rpent-gpu-$SUITE_ID"
          {
            echo "CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-<unset>}"
            uv --version
            uv cache dir
            uv python dir
            bash tests/e2e_tests/run_gpu_suite.sh \
              "$TARGET" "$output_dir" \
              "$RUNNER_TEMP/rpent-venvs-$SUITE_ID"
          } 2>&1 | tee "$output_dir.log"

      - name: Upload suite diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpu-e2e-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rpent-gpu-${{ env.SUITE_ID }}.log
            ${{ runner.temp }}/rpent-gpu-${{ env.SUITE_ID }}/**/*-junit.xml
            ${{ runner.temp }}/rpent-gpu-${{ env.SUITE_ID }}/**/*server.log
            ${{ runner.temp }}/rpent-gpu-${{ env.SUITE_ID }}/**/tool-coverage.json
            ${{ runner.temp }}/rpent-gpu-${{ env.SUITE_ID }}/**/*-daemon-cleanup.txt
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        shell: bash
        run: |
          for path in \
            "$RUNNER_TEMP/rpent-gpu-$SUITE_ID" \
            "$RUNNER_TEMP/rpent-venvs-$SUITE_ID"; do
            if [[ -d "$path" ]]; then
              find "$path" -depth -delete
            fi
          done
          rm -f "$RUNNER_TEMP/rpent-gpu-$SUITE_ID.log"
