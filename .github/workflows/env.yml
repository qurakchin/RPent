name: Environments

# Reusable clean-machine checks: every affected target is installed from its
# lock into a fresh venv, doctored, and — for simulator targets — exercised by
# the GPU suite. Nothing here decides which targets matter.
on:
  workflow_call:
    inputs:
      hosted:
        description: JSON array of targets installed on a hosted runner
        required: false
        type: string
        default: ""
      gpu:
        description: JSON array of targets installed on the embodied runner
        required: false
        type: string
        default: ""
      e2e:
        description: JSON array of simulator suites (libero, robocasa, robotwin)
        required: false
        type: string
        default: ""
      toolkit:
        description: Replay the geometry toolkit's frozen corpus
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hosted:
    name: Install ${{ matrix.target }}
    if: inputs.hosted != '' && inputs.hosted != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.hosted) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Fresh install from the lock
        run: |
          uv run --no-project --python 3.11 --with packaging -- \
            python -m rpent.cli.install install "${{ matrix.target }}" \
            --venv ".venv-${{ matrix.target }}"
      - name: Doctor the installed environment
        run: |
          uv run --no-project --python 3.11 --with packaging -- \
            python -m rpent.cli.install doctor --venv ".venv-${{ matrix.target }}"
      - name: Clean up
        if: always()
        run: find ".venv-${{ matrix.target }}" -depth -delete

  gpu:
    name: Fresh install ${{ matrix.target }}
    if: inputs.gpu != '' && inputs.gpu != '[]'
    runs-on: embodied
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.gpu) }}
    env:
      # Shared install policy used by RLinf's NVIDIA embodied runner.
      UV_CACHE_DIR: /workspace/dataset/.uv_cache
      UV_LINK_MODE: symlink
      UV_PYTHON_INSTALL_DIR: /workspace/dataset/.uv_python
      UV_TORCH_BACKEND: auto
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Fresh install from the lock
        run: |
          uv run --no-project --python 3.11 --with packaging -- \
            python -m rpent.cli.install install "${{ matrix.target }}" \
            --venv ".venv-${{ matrix.target }}"
      - name: Doctor the installed environment
        run: |
          uv run --no-project --python 3.11 --with packaging -- \
            python -m rpent.cli.install doctor --venv ".venv-${{ matrix.target }}"
      - name: Clean up
        if: always()
        run: find ".venv-${{ matrix.target }}" -depth -delete

  e2e:
    name: Simulator ${{ matrix.suite }}
    if: inputs.e2e != '' && inputs.e2e != '[]'
    runs-on: embodied
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.e2e) }}
    concurrency:
      group: robot-gpu-e2e-${{ github.workflow }}-${{ matrix.suite }}
      cancel-in-progress: true
    env:
      CUDA_VISIBLE_DEVICES: "0"
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl

      # Shared install policy used by RLinf's NVIDIA embodied runner.
      UV_CACHE_DIR: /workspace/dataset/.uv_cache
      UV_LINK_MODE: symlink
      UV_PYTHON_INSTALL_DIR: /workspace/dataset/.uv_python
      UV_TORCH_BACKEND: auto

      # Runner resources under the shared /workspace/dataset mount.
      #
      # LIBERO-PRO
      PI05_CHECKPOINT_PATH: /workspace/dataset/RLinf-Pi05-LIBERO-130-fullshot-SFT
      LIBERO_PRO_ASSET_PATH: /workspace/dataset/LIBERO-PRO/liberopro/liberopro/assets
      SAM3_CHECKPOINT_PATH: /workspace/dataset/rpent/sam3/sam3.pt
      #
      # RoboCasa
      RLDX_MODEL_PATH: /workspace/dataset/RLDX-1-FT-RC365
      ROBOCASA_ASSETS_PATH: /workspace/dataset/robocasa365_assets
      #
      # RoboTwin
      ROBOTWIN_ASSETS_PATH: /workspace/dataset/RoboTwin
      LINGBOT_MODEL_PATH: /workspace/dataset/rpent/LingBot-VLA-RoboTwin-EEF-ckpt1500
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Run the suite against its target
        timeout-minutes: 165
        shell: bash
        env:
          RPENT_INSTALL_TIMEOUT: 45m
          RPENT_TEST_TIMEOUT: 45m
          RPENT_GPU_PYTEST_TIMEOUT_SECONDS: "1200"
        run: |
          case "${{ matrix.suite }}" in
            libero) target=robot-libero_pro ;;
            *) target="${{ matrix.suite }}" ;;
          esac
          bash tests/e2e_tests/run_gpu_suite.sh \
            "$target" \
            "$RUNNER_TEMP/rpent-gpu-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_TEMP/rpent-venvs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Print server logs on failure
        if: failure()
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/rpent-gpu-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ -d "$output_dir" ]]; then
            while IFS= read -r -d '' log_path; do
              echo "::group::${log_path#"$output_dir"/}"
              cat "$log_path"
              echo "::endgroup::"
            done < <(find "$output_dir" -type f -name '*server.log' -print0)
          fi
      - name: Clean up
        if: always()
        shell: bash
        run: |
          for path in \
            "$RUNNER_TEMP/rpent-gpu-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_TEMP/rpent-venvs-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; do
            if [[ -d "$path" ]]; then
              find "$path" -depth -delete
            fi
          done

  toolkit:
    name: Geometry frozen replay
    if: inputs.toolkit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install the toolkit's evaluation target
        run: |
          uv run --no-project --python 3.11 --with packaging -- \
            python -m rpent.cli.install install tool-geometry --venv .venv-geometry-eval
      - name: Replay the frozen corpus
        run: |
          .venv-geometry-eval/bin/python -m \
            components.toolkits.geometry.evaluation.experiment \
            --output-dir geometry-eval-output
      - name: Upload the replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-eval-report
          path: geometry-eval-output/
          if-no-files-found: ignore
