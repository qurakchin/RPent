[tool.uv.extra-build-dependencies]
# Build RoboTwin's Torch extensions against its runtime Torch version.
# RoboDojo's fork skips Torch extension builds by default (CUROBO_USE_PYBIND=0).
nvidia-curobo = ["torch==2.8.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
# robots, toolkits and capabilities are top-level packages; without them,
# non-editable installations leave the CLI unable to import any backend. The
# globs also cover every per-robot subpackage (robots.yam.*, ...) and every
# model service (capabilities.molmo.*, ...).
include = [
  "rpent*",
  "robots",
  "robots.*",
  "toolkits",
  "toolkits.*",
  "capabilities",
  "capabilities.*",
]
exclude = ["tests*", "docs*", "examples*", "docker*"]

[tool.setuptools.package-data]
# Component manifests are runtime data: discovery reads them from installed
# packages, so every component package must ship its component.toml.
"*" = ["component.toml"]
"robots.robodojo" = ["guides/*.md"]
"rpent.dashboard" = ["*.html", "static/*.css", "static/*.js"]
"robots.yam" = ["config/*.yaml", "config/*.json", "guides/*.md"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
timeout = 60

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
isort = {known-first-party = ["rpent"]}
select = ["C", "E", "F", "I", "W", "CPY001", "RUF013", "UP006", "PERF102", "PLC1802", "PLC0208", "DOC102", "DOC202", "DOC403", "DOC502"]
ignore = [
    "C901", # "complex-structure"
    "E501", # "line-too-long"
    "E741", # "ambiguous-variable-name"
    "D100", # "Missing docstring in public module"
    "D104", # "Missing docstring in public package"
    "D203", # "incorrect-blank-line-before-class", conflict with D211,
    "D213", # "multi-line-summary-second-line", conflict with D212
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
