[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpent"
version = "0.1.0"
authors = [{ name = "RPent Contributors" }]
description = "Embodied agent framework for coordinating high-level reasoning and robot skills"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
keywords = [
    "embodied-intelligence",
    "large-language-models",
    "agent-framework",
]
classifiers = [
    #   2 - Pre-Alpha
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12 :: 12.4",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

dependencies = [
    # Upgrade together after validating request budgets and failed-request accounting.
    "pydantic-ai-slim[anthropic,google,openai,cli]==2.53.0",
    "pydantic-ai-harness==0.53.0",
    # Google GenAI 3.x changes the default API path from v1beta to v1.
    "google-genai<3",
    # Anthropic 2.x turns BetaMessageParam into a non-callable Union.
    # Remove after upgrading Pydantic AI to a release fixing:
    # https://github.com/pydantic/pydantic-ai/issues/10923
    "anthropic<2",
    "pydantic>=2",
    "tomli>=2; python_version < '3.11'",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "jsonschema>=4.18",
    "claude-agent-sdk>=0.2.154",
    "packaging",
    "openai-codex>=0.163.0",
    "agent-client-protocol>=0.12.1,<0.13",
    "mcp>=1.23.0,<2.0.0",
    "huggingface_hub>=0.24",
    "prompt-toolkit>=3.0.48",
    "numpy",
    "scipy",
    "imageio>=2.0",
    "PyYAML>=6.0",
]

[project.scripts]
rpent = "rpent.cli.main:main"
rpent-install = "rpent.cli.install:main"
rpent-memory = "rpent.cli.memory:main"
rpent-check-llm = "rpent.cli.check_llm:main"
rpent-flywheel = "rpent.flywheel.cli:main"

[project.urls]
Homepage = "https://github.com/RLinf/RPent"
Repository = "https://github.com/RLinf/RPent"
Documentation = "https://rpent.readthedocs.io/en/latest/"
"Bug Report" = "https://github.com/RLinf/RPent/issues"

# Compatibility path for the robots that installs/profiles does not cover yet.
# They install into a dedicated environment with their extra instead of a
# profile; see the robot's guide. Do not add a robot that has a profile here.
[project.optional-dependencies]
franka = [
    "defusedxml",
    "empy==3.3.4",
    "evdev",
    "franky-control @ https://github.com/Brunch-Life/franky/releases/download/wheels-libfranka-0.19.0/franky_control-1.1.3-cp310-cp310-manylinux_2_28_x86_64.whl ; python_version == '3.10' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "franky-control @ https://github.com/Brunch-Life/franky/releases/download/wheels-libfranka-0.19.0/franky_control-1.1.3-cp311-cp311-manylinux_2_28_x86_64.whl ; python_version == '3.11' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "franky-control @ https://github.com/Brunch-Life/franky/releases/download/wheels-libfranka-0.19.0/franky_control-1.1.3-cp312-cp312-manylinux_2_28_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "gymnasium==0.29.1",
    "imageio[ffmpeg]",
    "matplotlib>=3.8",
    "numpy<2",
    "opencv-python",
    "pillow>=10",
    "pyarrow<26.0.0",
    "pymodbus>=3.0,<4.0",
    "pyquaternion",
    "pyrealsense2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "pyserial",
    "pyspacemouse>=2.0.0",
    "pyyaml",
    "pyzmq",
    "rlinf @ git+https://github.com/RLinf/RLinf.git@2348ece3df113874671478be1360ae3115b346e3",
    "rospkg",
    "rpent-openpi @ git+https://github.com/RLinf/openpi.git@a560f4dd8205b8423ecd4c8a0fabb5f54140b8a0",
    "websockets",
]
robocasa = [
    "rlinf @ git+https://github.com/RLinf/RLinf.git@2348ece3df113874671478be1360ae3115b346e3",
    "rlinf-rldx @ git+https://github.com/RLinf/RLDX-1.git@ebcfd13df5177e4b3e574bdf5a3b427c7c4a1e8a",
    "robosuite @ git+https://github.com/RLinf/robosuite.git@97cfbde4b68d8ec43dad20cf4747297866a6ca2e",
    "rpent-robocasa365 @ git+https://github.com/RLinf/robocasa.git@2692d8fc5fd86708a1b2028dcbce892ec418a9e7",
]
robodojo-sim = [
    "einops>=0.8.0",
    "pillow>=10",
    "pyarrow>=21.0.0,<26.0.0",
    "pycocotools",
    "rlinf @ git+https://github.com/littleZ05/RLinf.git@91e0c6e361eff9371e2423a4183602481ae95ee5",
    "rlinf-robodojo-runtime @ git+https://github.com/RLinf/RoboDojo.git@6d76a0c4a49a7a47bf5ee3924de2ccd7ecb8a8b7",
    "rpent-openpi @ git+https://github.com/RLinf/openpi.git@a560f4dd8205b8423ecd4c8a0fabb5f54140b8a0",
    "sam3 @ git+https://github.com/RLinf/sam3.git@c1f6b1e83967c912f675d8975d437ccdc41e17d8",
    "torch",
    "torchvision",
]
robotwin = [
    "nvidia-curobo @ git+https://github.com/NVlabs/curobo.git@v0.7.8",
    "rlinf @ git+https://github.com/RLinf/RLinf.git@2348ece3df113874671478be1360ae3115b346e3",
    "rlinf-lingbotvla==0.1.3",
    "rlinf-robotwin-runtime==0.1.3",
]
sam3 = [
    "einops>=0.8.0",
    "pillow>=10",
    "pycocotools",
    "sam3 @ git+https://github.com/RLinf/sam3.git@c1f6b1e83967c912f675d8975d437ccdc41e17d8",
    "torch",
    "torchvision",
]
test = [
    "coverage",
    "gymnasium",
    "omegaconf",
    "pytest",
    "pytest-timeout",
]
yam = [
    "huggingface_hub>=0.24,<1",
    "imageio-ffmpeg",
    "mujoco>=3.2,<4",
    "omegaconf>=2.3,<3",
    "pyrealsense2>=2.55,<3",
]

[tool.uv]
prerelease = "allow"

# Each compatibility extra pulls a separately pinned simulator runtime whose
# Torch and Transformers versions are mutually incompatible with the others.
conflicts = [
    [{ extra = "franka" }, { extra = "robocasa" }],
    [{ extra = "franka" }, { extra = "robodojo-sim" }],
    [{ extra = "franka" }, { extra = "robotwin" }],
    [{ extra = "robocasa" }, { extra = "robotwin" }],
    [{ extra = "robodojo-sim" }, { extra = "robotwin" }],
]

[tool.uv.extra-build-dependencies]
# Build RoboTwin's Torch extensions against its runtime Torch version.
# RoboDojo's fork skips Torch extension builds by default (CUROBO_USE_PYBIND=0).
nvidia-curobo = ["torch==2.8.0"]

[tool.setuptools]
include-package-data = true
# Package discovery lives in setup.py because the published wheel and a
# source install intentionally differ: the wheel contains only rpent/, while
# editable and sdist builds also include robots/ and components/.

[tool.setuptools.package-data]
# Component manifests are runtime data: discovery reads them from installed
# packages, so every component package must ship its component.toml. The other
# entries are files the installed package opens by path: the dashboard
# frontend, and robot defaults and evaluation manifests.
"*" = ["component.toml"]
"robots.dual_franka" = ["config/*.yaml"]
"robots.franka" = ["config/*.yaml"]
"robots.libero" = ["guides/*.md"]
"robots.robocasa" = ["eval/*.json"]
"robots.robodojo" = ["guides/*.md"]
"robots.robotwin" = ["eval/*.json", "guides/*.md"]
"rpent.dashboard" = ["*.html", "static/*.css", "static/*.js"]
"robots.yam" = ["config/*.yaml", "config/*.json", "guides/*.md"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
timeout = 60

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
isort = {known-first-party = ["rpent"]}
select = ["C", "E", "F", "I", "W", "CPY001", "RUF013", "UP006", "PERF102", "PLC1802", "PLC0208", "DOC102", "DOC202", "DOC403", "DOC502"]
ignore = [
    "C901", # "complex-structure"
    "E501", # "line-too-long"
    "E741", # "ambiguous-variable-name"
    "D100", # "Missing docstring in public module"
    "D104", # "Missing docstring in public package"
    "D203", # "incorrect-blank-line-before-class", conflict with D211,
    "D213", # "multi-line-summary-second-line", conflict with D212
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
