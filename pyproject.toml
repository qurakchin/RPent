[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpent"
version = "0.1.0"
authors = [{ name = "RPent Contributors" }]
description = "Embodied agent framework for coordinating high-level reasoning and robot skills"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
keywords = [
    "embodied-intelligence",
    "large-language-models",
    "agent-framework",
]
classifiers = [
    #   2 - Pre-Alpha
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12 :: 12.4",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

dependencies = [
    # Upgrade together after validating request budgets and failed-request accounting.
    "pydantic-ai-slim[anthropic,openai,cli]==2.53.0",
    "pydantic-ai-harness==0.53.0",
    # Anthropic 2.x turns BetaMessageParam into a non-callable Union.
    # Remove after upgrading Pydantic AI to a release fixing:
    # https://github.com/pydantic/pydantic-ai/issues/10923
    "anthropic<2",
    "pydantic>=2",
    "tomli>=2; python_version < '3.11'",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "jsonschema>=4.18",
    "claude-agent-sdk>=0.2.154",
    "packaging",
    "openai-codex>=0.163.0",
    "mcp>=1.23.0,<2.0.0",
    "huggingface_hub>=0.24",
    "prompt-toolkit>=3.0.48",
    "numpy",
    "scipy",
    "imageio>=2.0",
    "PyYAML>=6.0",
]

[project.scripts]
rpent = "rpent.cli.main:main"
rpent-env = "rpent.cli.env:main"
rpent-memory = "rpent.cli.memory:main"
rpent-check-llm = "rpent.cli.check_llm:main"
rpent-flywheel = "rpent.flywheel.cli:main"

[project.urls]
Homepage = "https://github.com/RLinf/RPent"
Repository = "https://github.com/RLinf/RPent"
Documentation = "https://rpent.readthedocs.io/en/latest/"
"Bug Report" = "https://github.com/RLinf/RPent/issues"

