schema = 2
name = "flywheel"
kind = "deps"
# The flywheel runtime lives in core ``rpent/flywheel/``; the packages it needs
# have no component of their own, so an environment enables them by selecting
# this component in its target.
probe = "lerobot"
python = ">=3.11,<3.12"
description = "LeRobot trajectory export and replay."

dependencies = [
  "lerobot>=0.3.3,<0.4",
  "av<19",
  "pyarrow<26",
]
