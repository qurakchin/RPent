schema = 1
name = "unit-cpu"
python = "3.11"
platform = "linux-x86_64"

dependencies = [
  "coverage",
  "pytest",
  "pytest-timeout",
  "omegaconf",
  "gymnasium",
  # A model server imports Torch at module scope, and many unit tests import
  # those modules. The CPU wheel keeps the hosted runner small and avoids a
  # CUDA dependency the tests never exercise.
  "torch==2.6.0+cpu",
]

extra-index-urls = ["https://download.pytorch.org/whl/cpu"]
# Allow resolution to fall through between PyPI and the PyTorch index when
# the first index does not provide a compatible version, such as the CPU build.
index-strategy = "unsafe-first-match"
