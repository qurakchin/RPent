schema = 1
name = "flywheel"
kind = "capability"
probe = "rpent.flywheel"
python = ">=3.10,<3.13"
platforms = ["linux-x86_64"]
placement = ["in-env"]
env_conflicts = ["robotwin"]
docs = "docs/source-en/rst_source/guides/flywheel.rst"

dependencies = [
  "lerobot>=0.3.3,<0.4",
  # LeRobot 0.3.x expects Fraction frame rates; PyAV 19 returns AVRational.
  "av<19",
  # OpenPI requires NumPy 1.x; PyArrow 26 requires NumPy 2 at import time.
  "pyarrow<26",
]
