schema = 1
name = "rlinf"
kind = "capability"
probe = "rlinf"
python = ">=3.10,<3.13"
platforms = ["linux-x86_64"]
placement = ["in-env"]
# RoboDojo pins its own RLinf fork; both provide the ``rlinf`` package.
env_conflicts = ["rlinf-robodojo", "robodojo-sim"]
docs = "docs/source-en/rst_source/get_started/quickstart.rst"

dependencies = [
  "rlinf @ git+https://github.com/RLinf/RLinf.git@release/v0.4",
]
